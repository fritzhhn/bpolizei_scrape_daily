name: Polizeimeldungen scrapen

on:
  schedule:
    # Täglich 05:00 UTC ≈ 07:00 MESZ / 06:00 MEZ
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape-Modus"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - current
          - full

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        id: scrape
        continue-on-error: true
        env:
          MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          ARGS="--mode $MODE -v"
          if [ "$MODE" != "full" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          mkdir -p data/logs
          PYTHONPATH=. python -m scraper.scrape $ARGS

      - name: GitHub Pages generieren
        if: always()
        run: PYTHONPATH=. python scripts/generate_pages.py

      - name: Daten & Pages committen
        if: always()
        run: |
          if [ ! -f data/meldungen.db ]; then
            echo "Keine Datenbank erzeugt."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meldungen.db docs/index.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "chore(data): Meldungen & Pages aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
